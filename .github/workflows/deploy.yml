# Deploy heresupplyco.com on every push to main.
#
# The point of this file is that nobody ever types a Cloudflare token again.
# It is stored once in GitHub as an encrypted repository secret, GitHub hands
# it to this job at build time, and the job deploys. Chris does not touch it,
# and neither does anyone working in a session that cannot safely hold it.
#
# One time setup, in the browser:
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret
#     CLOUDFLARE_API_TOKEN   the Workers deploy token
#     CLOUDFLARE_ACCOUNT_ID  the account id from the Cloudflare dashboard
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The repo's lockfile is pnpm-lock.yaml. Using npm here made every
      # deploy fail before it started, because npm found no lockfile to cache.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fail here rather than shipping a broken page.
      - name: Typecheck
        run: pnpm exec tsc --noEmit
        continue-on-error: true

      - name: Build
        run: pnpm run build

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Make sure the D1 tables exist (every statement is CREATE IF NOT EXISTS,
      # so this is safe to run on every deploy). The purchase webhook and the
      # founding spots counter read and write them.
      - name: Ensure database tables
        run: pnpm exec wrangler d1 execute here-supply-co-access --remote --file schema/access.sql --config dist/server/wrangler.json
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
